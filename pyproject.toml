[project]
name = "tf2price"
version = "0.1.0"
description = "Consulta de preço de um Unusual do TF2 na Steam e na backpack.tf"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tf2price*"]

[tool.setuptools.package-data]
tf2price = [
    "data/*.json",
    "data/efeitos/*.webp",
    "painel/templates/*.html",
    "painel/static/*.css",
    "painel/static/*.js",
    "painel/static/brand/*.svg",
    "painel/static/fonts/*.woff2",
    "painel/static/licenses/*.txt",
    "painel/static/licenses/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
