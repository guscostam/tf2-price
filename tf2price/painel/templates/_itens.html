{# A new search invalidates the selected item and effect immediately. #}
<div id="effects" class="choice-list" aria-live="polite" hx-swap-oob="true">
  <p class="empty-state">Waiting for an item</p>
</div>
<div id="analysis" aria-live="polite" hx-swap-oob="true">
  <p class="empty-state">Waiting for an effect</p>
</div>
{% if nomes %}
{% for nome in nomes %}
<button type="button" hx-get="/efeitos"
        hx-vals='{"nome": {{ nome|tojson }}}'
        hx-target="#effects" hx-sync="#case-workflow:replace"
        data-case-request="item">{{ nome }}</button>
{% endfor %}
{% else %}
<p class="empty-state">No Unusual matches are on sale</p>
{% endif %}
