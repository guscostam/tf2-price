{# Trocar de item apaga a avaliação do item anterior. #}
<div id="analise" aria-live="polite" hx-swap-oob="true">
  <p class="vazio">aguardando efeito</p>
</div>
{% if efeitos %}
{% for e in efeitos %}
<button hx-get="/analise"
        hx-vals='{"nome": {{ nome | tojson }}, "efeito": {{ e | tojson }}}'
        hx-target="#analise">{{ e }}</button>
{% endfor %}
{% else %}
<p class="vazio">nenhuma listagem com efeito legível nesta página</p>
{% endif %}
