<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block titulo %}Avaliação de Unusual{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    /* A guia de avaliação: papel manilha, tinta industrial, carimbo de
       borracha. O carimbo é o único elemento alto da página, e o que ele
       carrega é a regra que governa o projeto — a idade do preço. */
    :root {
      /* Gabinete de espécimes: fundo escuro, a aura do efeito como única
         fonte de cor viva. A cor vem da arte, não de código. */
      --papel:   #0b0e12;
      --slip:    #12161c;
      --tinta:   #e4e7ec;
      --tinta-2: #97a1b0;
      --carimbo: #e07a5f;
      --aprovado:#6ee7a8;
      --linha:   rgba(228, 231, 236, .18);
      --display: "Big Shoulders Display", "Haettenschweiler", "Arial Narrow", sans-serif;
      --corpo:   "Spectral", Georgia, serif;
      --mono:    "IBM Plex Mono", ui-monospace, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: clamp(.75rem, 3vw, 3rem) clamp(.75rem, 3vw, 2rem);
      background: var(--papel);
      color: var(--tinta);
      font-family: var(--corpo);
      font-size: 16px;
      line-height: 1.5;
    }

    /* Grão do papel. Fixo, para não rolar junto e virar textura de tela. */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      opacity: .03;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23g)'/></svg>");
    }

    .guia {
      position: relative; z-index: 1;
      max-width: 58rem; margin: 0 auto;
      background: radial-gradient(120% 90% at 50% 0%, #1b2430 0%, var(--slip) 70%);
      border: 1px solid #222c38;
      box-shadow: 0 24px 60px -40px #000;
    }

    /* --- cabeçalho -------------------------------------------------- */
    .timbre {
      padding: clamp(1.1rem, 4vw, 2rem) clamp(1.1rem, 4vw, 2.4rem) 1.1rem;
      border-bottom: 3px double var(--tinta);
    }
    .timbre h1 {
      margin: 0;
      font-family: var(--display); font-weight: 800;
      font-size: clamp(2.3rem, 9vw, 3.6rem); line-height: .9;
      text-transform: uppercase; letter-spacing: .005em;
    }
    .cotacao {
      margin: .7rem 0 0;
      font-family: var(--mono); font-size: .72rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: .09em; color: var(--tinta-2);
    }
    .cotacao b { color: var(--tinta); font-weight: 600; }

    /* Duas colunas: a lista acompanha, a avaliação ocupa o espaço. Clicar num
       acompanhado troca só a direita, então a esquerda não pisca nem perde o
       lugar de rolagem. */
    .duas-colunas { display: grid; grid-template-columns: 19rem 1fr; }
    .coluna-esquerda { border-right: 1px solid var(--linha); }
    .coluna-direita { min-width: 0; }

    .acompanhado {
      display: grid; grid-template-columns: 1fr auto auto; gap: .2rem;
      align-items: center; border: 1px solid var(--linha); margin-bottom: .3rem;
    }
    .acompanhado.escolhido { border-color: var(--carimbo); }
    .acompanhado-abrir {
      display: flex; flex-direction: column; gap: .12rem; align-items: flex-start;
      background: none; border: 0; padding: .5rem .6rem; cursor: pointer;
      color: var(--tinta); text-align: left; width: 100%;
    }
    .acompanhado-abrir:hover { background: rgba(228, 231, 236, .07); }
    .acompanhado-nome { font-size: .85rem; }
    .acompanhado-efeito {
      font-family: var(--mono); font-size: .64rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--tinta-2);
    }
    .acompanhado-preco { font-family: var(--mono); font-size: .8rem; font-weight: 600; }
    .acompanhado-idade, .acompanhado-vazio {
      font-family: var(--mono); font-size: .62rem; color: var(--tinta-2);
    }
    .acompanhado-acao button {
      background: none; border: 0; color: var(--tinta-2); cursor: pointer;
      padding: .3rem .4rem; font-size: .9rem;
    }
    .acompanhado-acao button:hover { color: var(--carimbo); }
    .acompanhar button {
      background: none; border: 1px solid var(--linha); color: var(--tinta);
      font-family: var(--mono); font-size: .7rem; letter-spacing: .1em;
      text-transform: uppercase; padding: .45rem .8rem; cursor: pointer;
      margin-bottom: 1.2rem;
    }
    .acompanhar button:hover { border-color: var(--carimbo); color: var(--carimbo); }

    /* Abaixo de 60rem não cabem duas colunas: a lista vira uma faixa no topo,
       que é o que o celular consegue mostrar sem espremer os números. */
    @media (max-width: 60rem) {
      .duas-colunas { grid-template-columns: 1fr; }
      .coluna-esquerda { border-right: 0; border-bottom: 1px solid var(--linha); }
    }

    /* --- campos do formulário ---------------------------------------- */
    .campo { padding: clamp(1.1rem, 4vw, 1.7rem) clamp(1.1rem, 4vw, 2.4rem); }
    .campo + .campo { border-top: 1px dashed var(--linha); }

    .rotulo {
      display: block; margin-bottom: .55rem;
      font-family: var(--display); font-weight: 700; font-size: 1rem;
      text-transform: uppercase; letter-spacing: .14em; color: var(--tinta-2);
    }

    .dica { margin: .55rem 0 0; font-size: .82rem; color: var(--tinta-2); }
    .dica b { font-weight: 600; color: var(--tinta); }

    /* O campo de busca é uma linha para escrever em cima, não uma caixa. */
    #q {
      width: 100%; padding: .35rem .1rem;
      border: 0; border-bottom: 2px solid var(--tinta); border-radius: 0;
      background: transparent; color: var(--tinta);
      font-family: var(--corpo); font-size: clamp(1.1rem, 3.5vw, 1.4rem);
    }
    #q::placeholder { color: rgba(228, 231, 236, .35); }
    #q:focus { outline: 0; border-bottom-color: var(--carimbo); }

    /* --- opções selecionáveis ---------------------------------------- */
    .opcoes { margin-top: .9rem; display: grid; gap: .3rem; }
    .opcoes.colunas { grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); }
    .opcoes button {
      display: flex; align-items: center; gap: .6rem; width: 100%;
      padding: .5rem .7rem; text-align: left; cursor: pointer;
      border: 1px solid var(--linha); border-radius: 0;
      background: transparent; color: var(--tinta);
      font-family: var(--corpo); font-size: .95rem;
      transition: background .12s ease, border-color .12s ease;
    }
    .opcoes button::before {
      content: ""; flex: none; width: .62rem; height: .62rem;
      border: 1px solid var(--tinta);
    }
    .opcoes button:hover { background: rgba(228, 231, 236, .07); border-color: var(--tinta); }
    .opcoes button[data-escolhido] { background: var(--tinta); color: var(--slip); }
    .opcoes button[data-escolhido]::before { background: var(--slip); border-color: var(--slip); }

    .opcoes .vazio { grid-column: 1 / -1; }
    .vazio {
      margin: 0; padding: .7rem 0; border-top: 1px dotted var(--linha);
      font-family: var(--mono); font-size: .76rem;
      text-transform: uppercase; letter-spacing: .09em; color: var(--tinta-2);
    }

    /* --- etiquetas de nível ------------------------------------------ */
    /* A regra que governa a tela: todo número diz de que nível ele é. */
    .niveis { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; margin-bottom: .5rem; }
    .tag {
      font-family: var(--mono); font-weight: 600; font-size: .64rem;
      text-transform: uppercase; letter-spacing: .1em;
      padding: .28rem .45rem;
    }
    .tag-efeito { background: var(--tinta); color: var(--slip); }
    .tag-item {
      border: 1px solid var(--tinta); color: var(--tinta);
      background: repeating-linear-gradient(45deg, transparent 0 3px, rgba(228, 231, 236, .12) 3px 6px);
    }
    .cruz { font-family: var(--mono); font-size: .7rem; color: var(--tinta-2); }

    /* --- avaliação ---------------------------------------------------- */
    .avaliacao { animation: preenche .24s ease-out; }
    @keyframes preenche { from { opacity: 0; transform: translateY(.4rem); } }

    .avaliacao h2 {
      margin: 0; font-family: var(--display); font-weight: 800;
      font-size: clamp(1.7rem, 6vw, 2.4rem); line-height: 1;
      text-transform: uppercase; letter-spacing: .01em;
    }
    .item-nome { margin: .2rem 0 0; font-size: .85rem; color: var(--tinta-2); }

    .pago { margin: 1.1rem 0 1.4rem; }
    .pago .rotulo { margin-bottom: .15rem; }
    .cifrao {
      font-family: var(--mono); font-weight: 500; color: var(--tinta-2);
      font-size: clamp(1rem, 3vw, 1.35rem); letter-spacing: 0; margin-right: .1em;
    }
    .numero-grande {
      display: block; font-family: var(--mono); font-weight: 600;
      font-size: clamp(2.3rem, 9vw, 3.4rem); line-height: 1;
      letter-spacing: -.03em; font-variant-numeric: tabular-nums;
    }
    .em-chaves { font-family: var(--mono); font-size: .8rem; color: var(--tinta-2); }

    .bloco { margin-top: 1.6rem; }
    .bloco[data-nivel="item"] { border-left: 3px solid var(--tinta); padding-left: 1rem; }
    .bloco h3 {
      margin: 0 0 .5rem; font-family: var(--display); font-weight: 700;
      font-size: 1.25rem; text-transform: uppercase; letter-spacing: .06em;
    }
    .explica { margin: 0 0 .7rem; font-size: .88rem; color: var(--tinta-2); max-width: 46ch; }

    /* Linha de razão: rótulo, fio pontilhado, valor. Vocabulário de fatura. */
    .linha { display: flex; align-items: baseline; gap: .5rem; padding: .18rem 0; }
    .linha .fio { flex: 1; border-bottom: 1px dotted var(--linha); }
    .linha .valor {
      font-family: var(--mono); font-size: .98rem; font-weight: 500;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .linha.total .valor { font-size: 1.15rem; font-weight: 600; }
    .bom  { color: var(--aprovado); }
    .ruim { color: var(--carimbo); }

    .nota {
      margin: .8rem 0 0; padding-left: 1rem; text-indent: -1rem;
      font-size: .8rem; line-height: 1.45; color: var(--tinta-2); max-width: 54ch;
    }
    .nota b { color: var(--tinta); font-weight: 600; }

    /* --- o carimbo ---------------------------------------------------- */
    .carimbo {
      --cor: var(--carimbo); --giro: -3.5deg;
      float: right; margin: 0 0 .8rem 1.2rem;
      display: block; width: 11rem; padding: .55rem .5rem;
      border: 2px solid var(--cor); outline: 1px solid var(--cor); outline-offset: 3px;
      color: var(--cor); text-align: center; opacity: .87;
      transform: rotate(var(--giro));
      /* `multiply` era da paleta clara: escurecia a tinta sobre o papel
         manilha. Sobre o fundo escuro do gabinete ele escurece o que já é
         escuro e o carimbo salmão vira quase preto. `normal` mantém a cor. */
      mix-blend-mode: normal;
      font-family: var(--display); font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em; font-size: .78rem;
      animation: carimba .26s cubic-bezier(.2, .8, .3, 1.25) .1s backwards;
    }
    .carimbo b {
      display: block; margin: .1rem 0;
      font-family: var(--mono); font-weight: 600; font-size: 1.75rem;
      letter-spacing: -.02em; line-height: 1;
    }
    .carimbo-fresco  { --cor: var(--aprovado); }
    .carimbo-vencido { --giro: -6deg; }
    .carimbo-ausente { --cor: var(--tinta-2); --giro: 2.5deg; }
    @keyframes carimba {
      from { opacity: 0; transform: rotate(var(--giro)) scale(1.3); }
    }

    /* Espera: a linha do campo pulsa enquanto a Steam responde. */
    #espera { height: 2px; background: var(--carimbo); opacity: 0; transform-origin: left; }
    .htmx-request#espera, .htmx-request #espera { opacity: 1; animation: carrega 1.1s ease-in-out infinite; }
    @keyframes carrega { 0%, 100% { transform: scaleX(0); } 50% { transform: scaleX(1); } }

    @media (max-width: 34rem) {
      .carimbo { float: none; width: 100%; margin: 0 0 1rem; }
      .bloco[data-nivel="item"] { padding-left: .7rem; }
      /* Rótulo longo quebra em duas linhas e o fio vira um toco de dois
         pontinhos. Sem fio, o valor vai para a direita pela margem. */
      .linha { flex-wrap: wrap; }
      .linha .fio { display: none; }
      .linha .valor { margin-left: auto; }
    }

    /* O link de convite aparece uma vez so: o banco guarda apenas o hash do
       token, entao quem fechar a pagina sem copiar precisa gerar outro. Por
       isso ele ganha destaque em vez de virar mais uma linha de texto. */
    .aviso {
      margin: 0 0 1rem; padding: .7rem .9rem;
      border-left: 4px solid var(--carimbo);
      /* rgba do --carimbo atual (#e07a5f); o antigo (#9c2a22, paleta clara)
         a 7% desaparecia sobre o fundo escuro. */
      background: rgba(224, 122, 95, .10);
      font-size: .9rem;
    }
    .aviso code {
      display: block; margin-top: .4rem;
      font-family: var(--mono); font-size: .85rem;
      word-break: break-all; color: var(--tinta);
    }

    .erro {
      border: 2px solid var(--carimbo); border-left-width: 6px;
      padding: .8rem 1rem; color: var(--carimbo);
      font-family: var(--mono); font-size: .88rem;
    }
    .erro b {
      display: block; font-family: var(--display); font-weight: 700;
      font-size: 1.05rem; text-transform: uppercase; letter-spacing: .08em;
    }

    a { color: var(--tinta); text-underline-offset: .2em; }
    a:hover { color: var(--carimbo); }
    :focus-visible { outline: 2px solid var(--carimbo); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    @media print {
      /* A paleta da tela é escura; no papel ela precisa se inverter de volta,
         senão sai tinta clara sobre branco. Redefinir os tokens conserta tudo
         que os usa de uma vez. */
      :root {
        --papel: #fff; --slip: #fff; --tinta: #221e19; --tinta-2: #5f5849;
        --linha: rgba(34, 30, 25, .25);
      }
      body { background: #fff; padding: 0; }
      body::before, .campo[data-campo="item"] .opcoes, #espera { display: none; }
      /* A aura é composta em `screen`, que não significa nada no papel. */
      .placa { display: none; }
      .guia { border: 0; box-shadow: none; max-width: none; background: #fff; }
    }

    .topo-conta {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 1rem; margin-bottom: .6rem;
      font-family: var(--mono); font-size: .72rem; letter-spacing: .09em;
      text-transform: uppercase; color: var(--tinta-2);
    }
    .topo-conta form { margin: 0; }
    .topo-conta button {
      background: none; border: 0; padding: 0; cursor: pointer;
      font: inherit; color: var(--tinta-2); text-decoration: underline;
    }
    .topo-conta button:hover { color: var(--carimbo); }
    .campo-form { margin-bottom: 1rem; }
    .campo-form label {
      display: block; margin-bottom: .3rem;
      font-family: var(--display); font-weight: 700; font-size: .95rem;
      text-transform: uppercase; letter-spacing: .14em; color: var(--tinta-2);
    }
    .campo-form input {
      width: 100%; padding: .45rem .1rem;
      border: 0; border-bottom: 2px solid var(--tinta); border-radius: 0;
      background: transparent; color: var(--tinta);
      font-family: var(--corpo); font-size: 1.1rem;
    }
    .campo-form input:focus { outline: 0; border-bottom-color: var(--carimbo); }
    .acao {
      font-family: var(--display); font-weight: 700; font-size: 1rem;
      text-transform: uppercase; letter-spacing: .12em;
      background: var(--tinta); color: var(--slip);
      border: 0; padding: .6rem 1.4rem; cursor: pointer;
    }
    .acao:hover { background: var(--carimbo); }

    /* --- a placa do espécime ------------------------------------------ */
    .placa { margin: 0 0 1.2rem; border: 1px solid #222c38; background: #0c1015; }
    .palco { position: relative; height: 200px; overflow: hidden; }
    .chapeu {
      position: absolute; left: 50%; top: 54%; width: 120px;
      transform: translate(-50%, -50%); z-index: 2;
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, .7));
    }
    /* Campo de emissão: três cópias da mesma arte nascendo embaixo, subindo e
       morrendo em cima, defasadas. É o que uma partícula faz no jogo, e é o
       mais perto do efeito real sem existir vídeo dele. */
    .aura {
      position: absolute; left: 50%; top: 50%; width: 200px; height: 200px;
      transform: translate(-50%, -50%); mix-blend-mode: screen;
      pointer-events: none; animation: emite 3.6s linear infinite;
    }
    .aura:nth-of-type(2) { animation-delay: -2.4s; width: 150px; height: 150px; }
    .aura:nth-of-type(3) { animation-delay: -1.2s; width: 236px; height: 236px; opacity: .5; }
    @keyframes emite {
      0%   { transform: translate(-50%, -32%) scale(.8);  opacity: 0; }
      20%  { opacity: .95; }
      100% { transform: translate(-50%, -74%) scale(1.18); opacity: 0; }
    }
    /* Sem arte, a placa deixa de ser palco de sobreposição e vira
       empilhamento: o item em cima, o nome do efeito embaixo. Sobrepor os
       dois cortava o texto pela metade — visto no navegador, não suposto. */
    .palco-sem-arte {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .9rem;
    }
    .palco-sem-arte .chapeu { position: static; transform: none; width: 96px; }
    .palco-sem-arte .sem-arte { position: static; inset: auto; }

    /* Efeito sem arte não ganha aura inventada: ganha o próprio nome. */
    .sem-arte {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: .5rem; text-align: center;
    }
    .sem-arte-nome {
      font-family: var(--mono); font-size: clamp(1rem, 4vw, 1.5rem);
      letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-2);
      border-bottom: 1px solid var(--linha); padding-bottom: .4rem;
    }
    .sem-arte-marca {
      font-family: var(--mono); font-size: .66rem; letter-spacing: .12em;
      text-transform: uppercase; color: #6b7482;
    }
  </style>
</head>
<body{% block corpo_attrs %}{% endblock %}>
  <main class="guia">
    <header class="timbre">
      {% if usuario %}
      <div class="topo-conta">
        <span>{{ usuario.nome }}{% if usuario.admin %} · <a href="/admin">admin</a>{% endif %}</span>
        <form method="post" action="/sair"><button type="submit">sair</button></form>
      </div>
      {% endif %}
      <h1>{% block cabecalho %}Avaliação de Unusual{% endblock %}</h1>
      {% block subtitulo %}{% endblock %}
    </header>
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
